name: Security Gate — DevSecOps Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # SAST: Semgrep static analysis
  # ──────────────────────────────────────────────
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/html
            p/secrets
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Secret Scanning: gitleaks
  # ──────────────────────────────────────────────
  gitleaks:
    name: Secret Scan — gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Container Vulnerability Scan: Trivy
  # ──────────────────────────────────────────────
  trivy:
    name: Container Scan — Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: portfolio:scan
          load: true
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'portfolio:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'      # CRITICAL/HIGH = block the pipeline

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Trivy summary (table view)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'portfolio:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

  # ──────────────────────────────────────────────
  # Gate: All security checks must pass
  # ──────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [semgrep, gitleaks, trivy]
    if: always()

    steps:
      - name: Check all security jobs passed
        run: |
          if [[ "${{ needs.semgrep.result }}" != "success" || \
                "${{ needs.gitleaks.result }}" != "success" || \
                "${{ needs.trivy.result }}" != "success" ]]; then
            echo "❌ Security gate FAILED — pipeline blocked"
            exit 1
          fi
          echo "✅ All security checks passed — gate open"
